---
layout: default
title: Sandbox
---

<div class="container">
  <div class="row">
    <div class="col-xs-12 col-sm-7 col-md-6 col-lg-5">
      <div id="playground-box">
        <canvas id="playground" width="320" height="240"></canvas>
        <div style="display:block; width: 100%; text-align: center;">
          Score: <div id="score" class="odometer train-station"></div>.
        </div>
      </div>
    </div>
    <div class="col-xs-12 col-sm-5 col-md-6 col-lg-7">
      <div id="ai-box">
        <div id="ai-script">
          <textarea id="ai"></textarea>
        </div>
        <div class="form-inline" id="operator" style="text-align: right;">
          <a class="btn btn-default" id="btn-mode">
            Toggle mode
          </a>
          <a class="btn btn-primary" id="btn-load">
            Load
          </a>
          <a class="btn btn-success" id="btn-start">
            Start
          </a>
          <a class="btn btn-danger" id="btn-reset">
            Reset
          </a>
          <select class="form-control" id="ai-examples">
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="container" id="result-log">
  <div id="results">
  </div>
</div>
<!-- Modal -->
<div class="modal fade" id="modal-share" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
        <h4 class="modal-title" id="myModalLabel">Share with your friends</h4>
      </div>
      <div class="modal-body">
        <h1>Will Any One Challenge Me? </h1>
        <img id="share-qr" src="#" alt="QR Code" style="float:right;">
        <pre id="share-cn"></pre>
        <pre id="share-en"></pre>
        <div class="alert alert-warning">Warning: Sharing this page may make your code public. Share it at your own
          risk. <br>警告: 分享此页面将使代码公开, 请自行承担此行为带来的后果. </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->


<script src="{{ site.baseurl }}/js/jquery-2.0.3.min.js"></script>
<script src="{{ site.baseurl }}/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/base64.js"></script>
<script src="{{ site.baseurl }}/js/countUp.min.js"></script>
<script src="{{ site.baseurl }}/js/nanobar.min.js"></script>
<script src="{{ site.baseurl }}/js/snake.js"></script>
<script src="{{ site.baseurl }}/js/main.js"></script>
<script src="{{ site.baseurl }}/js/intro.min.js"></script>

<script>
  function startIntro() {
    var intro = introJs();
    intro.setOptions({
      steps: [
        {
          intro: "Hello, this is Snake-AI, a sand box for testing AI scripts. "
        },
        {
          element: '#ai-script',
          intro: "Just input your scripts here, ",
        },
        {
          element: '#btn-load',
          intro: "and click here to load your scripts, ",
        },
        {
          element: '#btn-start',
          intro: "and click here to start! "
        },
        {
          element: '#score',
          intro: "Your score of this game will be shown here. "
        },
        {
          intro: "There will be a progress bar showing how many steps your snake has walked. <br>Your snake will be allowed to make 10000 moves"
        },
        {
          element: '#btn-reset',
          intro: "If you want to stop your scripts, click here. "
        },
        {
          element: '#btn-mode',
          intro: "This button can make your snake run faster / slower. "
        },
        {
          intro: 'So let the snake run! '
        }
      ]
    });

    intro.start();
  }
  startIntro();
</script>

<script src="{{ site.baseurl }}/js/shorturl.js"></script>
